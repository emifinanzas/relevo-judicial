<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Judicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f7f6f2;
  --bg2:#ffffff;
  --bg3:#f0eeea;
  --bg4:#e8e5e0;
  --border:#ddd9d2;
  --border2:#c8c3bb;
  --text:#1a1814;
  --text2:#6b6560;
  --text3:#aaa49c;
  --red:#c0392b;--red-bg:#fdf3f2;--red-border:#f5c6c2;--red-mid:#e74c3c;
  --amber:#a05c00;--amber-bg:#fdf8f0;--amber-border:#f0d9a8;
  --blue:#1a4a7a;--blue-bg:#f0f4fa;--blue-border:#b8cde8;
  --green:#1a5c3a;--green-bg:#f0f7f3;--green-border:#a8d4bc;
  --stale:#6a4c93;--stale-bg:#f5f0fb;--stale-border:#d4b8f0;
  --radius:5px;--radius-lg:8px;
  --font:'Source Sans 3',sans-serif;
  --serif:'Lora',serif;
  --shadow:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.topbar{background:var(--blue);padding:0 20px;display:flex;align-items:center;gap:14px;height:50px;position:sticky;top:0;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.logo{font-family:var(--serif);font-size:15px;font-weight:600;color:#fff;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo-sep{color:rgba(255,255,255,.35);font-weight:300;font-size:18px}
.logo-sub{font-family:var(--font);font-size:11px;font-weight:400;color:rgba(255,255,255,.65);letter-spacing:.03em}
.topbar-mid{flex:1;text-align:center;font-size:12px;color:rgba(255,255,255,.8);font-style:italic}
.turno-chip{font-family:var(--font);font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);letter-spacing:.04em;text-transform:uppercase}
.sync-status{font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:4px;transition:color .3s}
.sync-status.ok{color:rgba(144,238,144,.9)}
.sync-status.err{color:rgba(255,150,150,.9)}
.sync-status.loading{color:rgba(255,220,100,.9)}

.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;box-shadow:var(--shadow)}
.nav-tab{padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--font);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transition:all .15s}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.nc{font-size:10px;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;font-weight:600}
.nc-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.nc-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.nc-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

.page{display:none}.page.active{display:flex;flex-direction:column;gap:10px;padding:12px 16px}

.avisos-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 14px;display:flex;align-items:flex-start;gap:10px;box-shadow:var(--shadow)}
.avisos-scroll{flex:1;display:flex;flex-direction:column;gap:5px;max-height:90px;overflow-y:auto}
.aviso-item{display:flex;align-items:baseline;gap-7px;gap:7px;font-size:12px;line-height:1.5}
.aviso-pin{font-size:10px;padding:1px 8px;border-radius:20px;white-space:nowrap;font-weight:600;flex-shrink:0;letter-spacing:.03em;text-transform:uppercase}
.pin-rojo{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.pin-azul{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.pin-verde{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.pin-gris{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.pin-stale{background:var(--stale-bg);color:var(--stale);border:1px solid var(--stale-border)}
.aviso-txt{color:var(--text);font-size:12px}
.btn-aviso{padding:5px 11px;font-size:11px;font-weight:500;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:var(--font);white-space:nowrap;align-self:flex-start;transition:all .15s}
.btn-aviso:hover{background:var(--bg4);color:var(--text)}

.cuadrantes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cuad{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.cuad-hdr{padding:9px 13px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;border-bottom:1px solid var(--border)}
.cuad-hdr.urg{background:var(--red-bg);color:var(--red);border-bottom-color:var(--red-border)}
.cuad-hdr.pend{background:var(--amber-bg);color:var(--amber);border-bottom-color:var(--amber-border)}
.cuad-hdr.med{background:var(--blue-bg);color:var(--blue);border-bottom-color:var(--blue-border)}
.cuad-hdr.gua{background:var(--green-bg);color:var(--green);border-bottom-color:var(--green-border)}
.cuad-body{padding:8px;overflow-y:auto;max-height:240px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}

.tarjeta{border-radius:var(--radius);padding:9px 11px;border:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;gap:5px;transition:border-color .15s;box-shadow:var(--shadow)}
.tarjeta:hover{border-color:var(--border2)}
.tarjeta.t-urg{border-left:3px solid var(--red-mid)}
.tarjeta.t-pend{border-left:3px solid var(--amber)}
.tarjeta.t-med{border-left:3px solid var(--blue)}
.tarjeta.t-gua{border-left:3px solid var(--green)}
.tarjeta.t-stale{border-left:3px solid var(--stale);background:var(--stale-bg)}
.tarjeta-desc{font-size:12px;font-weight:600;line-height:1.4;color:var(--text)}
.tarjeta-ref{font-size:11px;color:var(--text2)}
.tarjeta-obs{font-size:11px;color:var(--amber);border-top:1px solid var(--border);padding-top:4px;margin-top:2px}
.tarjeta-stale{font-size:10px;color:var(--stale);font-weight:600;letter-spacing:.03em}
.tarjeta-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}

.btn-listo{padding:4px 11px;font-size:11px;font-weight:600;border-radius:var(--radius);border:1px solid var(--green-border);background:var(--green-bg);color:var(--green);cursor:pointer;font-family:var(--font);transition:all .15s;letter-spacing:.02em}
.btn-listo:hover{background:var(--green);color:#fff}
.btn-urg-t{padding:3px 8px;font-size:11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-urg-t.on{background:var(--red-bg);color:var(--red);border-color:var(--red-border);font-weight:600}
.btn-mini{padding:3px 8px;font-size:11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .15s}
.btn-mini:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.btn-mini.azul{color:var(--blue);border-color:var(--blue-border);background:var(--blue-bg)}
.btn-pri{padding:8px 18px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-family:var(--font);font-size:13px;cursor:pointer;font-weight:600;transition:all .15s}
.btn-pri:hover{background:var(--text)}
.obs-mini{width:100%;padding:5px 8px;border:1px solid var(--amber-border);border-radius:var(--radius);font-family:var(--font);font-size:11px;background:var(--bg2);color:var(--text);margin-top:2px}
.obs-mini:focus{outline:none;border-color:var(--amber)}
.empty-cuad{font-size:11px;color:var(--text3);text-align:center;padding:20px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-style:italic}

.gua-add{display:flex;gap:5px;margin-top:6px;padding-top:7px;border-top:1px solid var(--border)}
.gua-add input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--bg2);color:var(--text)}
.gua-add input:focus{outline:none;border-color:var(--blue)}
.gua-add select{padding:5px 5px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:11px;background:var(--bg2);color:var(--text);width:68px}
.badge-pri{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600}
.bp-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.bp-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.bp-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

.movimientos{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.mov-hdr{padding:8px 14px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:6px;background:var(--bg3)}
.mov-body{padding:4px 12px;overflow-y:auto;max-height:120px}
.mov-row{font-size:11px;padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:baseline}
.mov-time{color:var(--text3);white-space:nowrap;min-width:78px;font-size:10px}
.mov-msg{color:var(--text2)}

.panel-exp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.exp-search{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:7px;flex-wrap:wrap;background:var(--bg3)}
.exp-search input,.exp-search select{padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--bg2);color:var(--text)}
.exp-search input{flex:1;min-width:140px}
.exp-search input:focus,.exp-search select:focus{outline:none;border-color:var(--blue)}
.exp-lista{padding:10px}
.exp-card{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px;overflow:hidden;transition:border-color .15s}
.exp-card:hover{border-color:var(--border2)}
.exp-hdr{padding:9px 11px;display:flex;align-items:center;gap:7px;cursor:pointer;background:var(--bg3);user-select:none}
.exp-hdr:hover{background:var(--bg4)}
.exp-tit{flex:1;font-size:13px;font-weight:600;color:var(--text)}
.exp-meta{font-size:11px;color:var(--text2)}
.exp-bdy{padding:9px 11px;border-top:1px solid var(--border);background:var(--bg)}
.tarea-fila{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:4px;background:var(--bg2)}
.tarea-fila.u{border-left:3px solid var(--red-mid)}
.tarea-fila.m{border-left:3px solid var(--blue)}
.tarea-fila.s{border-left:3px solid var(--stale);background:var(--stale-bg)}
.tchk{width:14px;height:14px;cursor:pointer;accent-color:var(--green);flex-shrink:0;margin-top:2px}
.ttxt{font-size:12px;flex:1;line-height:1.4;color:var(--text)}
.ttxt.done{text-decoration:line-through;color:var(--text3)}
.add-row{display:flex;gap:6px;margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.add-row input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--bg2);color:var(--text)}
.add-row input:focus{outline:none;border-color:var(--blue)}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;font-weight:600}
.b-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.b-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.b-v{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.b-az{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.b-s{background:var(--stale-bg);color:var(--stale);border:1px solid var(--stale-border)}

.panel-nuevo{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;box-shadow:var(--shadow)}
.panel-nuevo-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);transition:border-color .15s}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--blue);background:var(--bg2)}
.ff{grid-column:1/-1}
.tareas-sel{display:flex;flex-direction:column;gap:3px;max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:8px;background:var(--bg)}
.tsl{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:3px 0;color:var(--text)}
.tsl:hover{color:var(--blue)}
.urgente-check-label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;color:var(--red);font-weight:500}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;width:360px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow-md)}
.modal h3{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--text)}
.modal input,.modal select,.modal textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;background:var(--bg);color:var(--text);width:100%}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--blue)}
.modal textarea{resize:vertical;min-height:70px}
.modal-btns{display:flex;gap:7px;justify-content:flex-end}

.config-banner{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:8px 13px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:8px;font-weight:500}

.toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg2);padding:9px 16px;border-radius:var(--radius);font-size:12px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;box-shadow:var(--shadow-md)}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <i class="ti ti-scale" style="font-size:18px;opacity:.9"></i>
    Unidad Judicial
    <span class="logo-sep">|</span>
    <span class="logo-sub">Sistema de Relevo</span>
  </div>
  <div class="topbar-mid" id="resumen"></div>
  <div class="turno-chip" id="turno-chip"></div>
  <div class="sync-status" id="sync-status">
    <i class="ti ti-circle"></i> <span id="sync-txt">local</span>
  </div>
</div>

<div class="nav">
  <button class="nav-tab active" onclick="setPage('pizarron')" id="ntab-pizarron">
    <i class="ti ti-layout-dashboard"></i> Pizarrón
    <span class="nc nc-r" id="nc-piz">0</span>
  </button>
  <button class="nav-tab" onclick="setPage('expedientes')" id="ntab-expedientes">
    <i class="ti ti-folder"></i> Expedientes
    <span class="nc nc-g" id="nc-exp">0</span>
  </button>
  <button class="nav-tab" onclick="setPage('nuevo')" id="ntab-nuevo">
    <i class="ti ti-plus"></i> Nuevo expediente
  </button>
</div>

<div class="page active" id="page-pizarron">
  <div id="config-banner-wrap"></div>

  <div class="avisos-bar">
    <i class="ti ti-speakerphone" style="font-size:15px;color:var(--text2);flex-shrink:0;margin-top:2px"></i>
    <div class="avisos-scroll" id="avisos-lista"></div>
    <button class="btn-aviso" onclick="abrirModalAviso()"><i class="ti ti-plus"></i> Aviso</button>
  </div>

  <div class="cuadrantes">
    <div class="cuad">
      <div class="cuad-hdr urg"><i class="ti ti-alert-triangle"></i> Urgentes <span class="nc nc-r" id="cnt-urg">0</span></div>
      <div class="cuad-body" id="cuad-urgentes"></div>
    </div>
    <div class="cuad">
      <div class="cuad-hdr pend"><i class="ti ti-clock"></i> Pendientes <span class="nc nc-a" id="cnt-pend">0</span></div>
      <div class="cuad-body" id="cuad-pendientes"></div>
    </div>
    <div class="cuad">
      <div class="cuad-hdr med"><i class="ti ti-clock-pause"></i> A medias <span class="nc nc-a" id="cnt-med">0</span></div>
      <div class="cuad-body" id="cuad-medias"></div>
    </div>
    <div class="cuad">
      <div class="cuad-hdr gua"><i class="ti ti-shield"></i> Guardia <span class="nc nc-g" id="cnt-gua">0</span></div>
      <div class="cuad-body" id="cuad-guardia">
        <div id="gua-lista"></div>
        <div class="gua-add">
          <input type="text" id="gua-txt" placeholder="Nueva tarea de guardia...">
          <select id="gua-pri"><option>Alta</option><option selected>Media</option><option>Baja</option></select>
          <button class="btn-mini azul" onclick="agregarGuardia()"><i class="ti ti-plus"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="movimientos">
    <div class="mov-hdr"><i class="ti ti-history" style="font-size:13px"></i> Últimos movimientos</div>
    <div class="mov-body" id="mov-lista"></div>
  </div>
</div>

<div class="page" id="page-expedientes">
  <div class="panel-exp">
    <div class="exp-search">
      <input type="text" id="busq-g" placeholder="Buscar por SAC, causante, brigada..." oninput="renderExps()">
      <input type="text" id="busq-sac" placeholder="Nro SAC exacto..." oninput="renderExps()" style="max-width:180px">
      <select id="fil-est" onchange="renderExps()"><option value="">Todos los estados</option><option>Activa</option><option>En espera</option><option>Cerrada</option></select>
      <select id="fil-tipo" onchange="renderExps()"><option value="">Todos los tipos</option><option>Colaboración</option><option>Investigación</option><option>Otro</option></select>
    </div>
    <div class="exp-lista" id="exp-lista"></div>
  </div>
</div>

<div class="page" id="page-nuevo">
  <div class="panel-nuevo">
    <div class="panel-nuevo-title"><i class="ti ti-file-plus" style="font-size:16px;vertical-align:-2px;margin-right:7px"></i>Cargar nuevo expediente</div>
    <div class="form-grid">
      <div class="fg"><label>Número SAC *</label><input type="text" id="f-sac" placeholder="SAC-2024-0042"></div>
      <div class="fg"><label>Tipo de trámite *</label>
        <select id="f-tipo" onchange="actualizarCat()">
          <option value="">— Seleccionar —</option><option>Colaboración</option><option>Investigación</option><option>Otro</option>
        </select>
      </div>
      <div class="fg ff"><label>Causantes / Detenidos *</label><input type="text" id="f-caus" placeholder="García, Juan / López, María"></div>
      <div class="fg"><label>Brigada</label><input type="text" id="f-brig" placeholder="Brigada A"></div>
      <div class="fg"><label>Estado</label>
        <select id="f-est2"><option>Activa</option><option>En espera</option><option>Cerrada</option></select>
      </div>
      <div class="fg ff"><label>Tareas del catálogo <span style="font-weight:400;text-transform:none;font-size:11px;color:var(--text2)">(destildá las que no apliquen)</span></label>
        <div class="tareas-sel" id="cat-sel"><span style="color:var(--text2);font-size:12px">Elegí un tipo de trámite primero.</span></div>
      </div>
      <div class="fg ff">
        <label>Urgencia inicial</label>
        <label class="urgente-check-label" style="margin-top:4px">
          <input type="checkbox" id="f-urgente" class="tchk" style="accent-color:var(--red)">
          Marcar este expediente como urgente desde el inicio
        </label>
      </div>
      <div class="fg ff"><label>Tarea adicional (libre)</label><input type="text" id="f-extra" placeholder="Tarea no prevista en el catálogo..."></div>
      <div class="ff" style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
        <button class="btn-mini" onclick="limpiarF()">Limpiar</button>
        <button class="btn-pri" onclick="guardarExp()"><i class="ti ti-device-floppy" style="font-size:13px"></i> Guardar expediente</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-wrap"></div>
<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = "";

const CAT={
  "Colaboración":["Declarar Dupla","Colaboración","Constatación","Estado de Salud","Disposición conjunta","SENAF","Antecedentes","ITN – Titularidad","RUA – Balística","Domo - 911","Otro"],
  "Investigación":["Vigilancia Previa","SENAF","Estado de Salud","Constatación","RUA – Balística","ITN – Titularidad","Otro"],
  "Otro":["Otro"]
};

const TURNOS=[
  {label:"Mañana",start:7,end:13},
  {label:"Tarde",start:13,end:19},
  {label:"Noche",start:19,end:25},
  {label:"Trasnoche",start:1,end:7}
];

let DB={expedientes:[],tareas:[],guardia:[],avisos:[],log:[]};
let expanded={};
const LS_KEY="relevo_uj_v2";
const STALE_MS=3*24*60*60*1000; // 3 días

function turnoActual(){
  const h=new Date().getHours();
  if(h>=7&&h<13)return"Mañana";
  if(h>=13&&h<19)return"Tarde";
  if(h>=19)return"Noche";
  return"Trasnoche";
}
function ts(){
  const d=new Date();
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" "+
    d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function addLog(msg){DB.log.unshift({ts:ts(),msg});if(DB.log.length>80)DB.log.pop();}
function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400);}

function parseTs(s){
  if(!s)return 0;
  try{
    const[fecha,hora]=s.split(" ");
    const[d,m]=fecha.split("/");
    const[h,min]=hora.split(":");
    const yr=new Date().getFullYear();
    return new Date(yr,parseInt(m)-1,parseInt(d),parseInt(h),parseInt(min)).getTime();
  }catch(e){return 0;}
}

function isStale(t){
  if(t.estado==="completo")return false;
  const last=t.fechaMod||t.fechaComp||null;
  if(!last)return false;
  return(Date.now()-parseTs(last))>STALE_MS;
}

function saveLocal(){localStorage.setItem(LS_KEY,JSON.stringify(DB));}
function loadLocal(){
  try{const s=localStorage.getItem(LS_KEY);if(s)DB=JSON.parse(s);}catch(e){}
  if(!DB.avisos)DB.avisos=[];if(!DB.guardia)DB.guardia=[];if(!DB.log)DB.log=[];
  if(!DB.avisos.length)DB.avisos=[
    {id:uid(),tipo:"azul",texto:"Bienvenidos al turno "+turnoActual()+". Revisá urgentes antes de comenzar.",ts:ts(),auto:true},
    {id:uid(),tipo:"rojo",texto:"Recordar declarar a las duplas apenas se reciban.",ts:ts()},
    {id:uid(),tipo:"verde",texto:"Iniciar expedientes apenas se consulten. No dejar pendiente.",ts:ts()},
  ];
}

function setSyncStatus(state,msg){
  const el=document.getElementById("sync-status");
  const txt=document.getElementById("sync-txt");
  el.className="sync-status "+state;txt.textContent=msg;
  const icons={ok:"ti-circle-check",err:"ti-circle-x",loading:"ti-refresh","":'ti-circle'};
  el.querySelector("i").className="ti "+(icons[state]||"ti-circle");
}

async function syncRemote(action,payload={}){
  if(!APPS_SCRIPT_URL)return null;
  setSyncStatus("loading","sincronizando...");
  try{
    const r=await fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify({action,...payload}),headers:{"Content-Type":"text/plain"}});
    const data=await r.json();
    setSyncStatus("ok","sincronizado "+ts());
    return data;
  }catch(e){setSyncStatus("err","sin conexión");return null;}
}

async function cargarDesdeRemoto(){
  if(!APPS_SCRIPT_URL){setSyncStatus("","local");return;}
  const data=await syncRemote("GET_ALL");
  if(data&&data.ok){DB=data.db;if(!DB.avisos)DB.avisos=[];if(!DB.guardia)DB.guardia=[];if(!DB.log)DB.log=[];saveLocal();}
}

async function saveDB(){
  saveLocal();
  if(APPS_SCRIPT_URL)await syncRemote("SAVE_ALL",{db:DB});
  else setSyncStatus("","local");
}

function setPage(p){
  ["pizarron","expedientes","nuevo"].forEach(id=>{
    document.getElementById("page-"+id).classList.toggle("active",id===p);
    document.getElementById("ntab-"+id).classList.toggle("active",id===p);
  });
  if(p==="expedientes")renderExps();
}

function prioOrd(p){return p==="Alta"?0:p==="Media"?1:2;}
function sorted(arr){
  return[...arr].sort((a,b)=>{
    if(a.urgente!==b.urgente)return a.urgente?-1:1;
    const pp=prioOrd(a.prioridad||"Media")-prioOrd(b.prioridad||"Media");
    if(pp!==0)return pp;
    return(a.id||"").localeCompare(b.id||"");
  });
}

function getStaleAvisos(){
  const stale=DB.tareas.filter(t=>t.estado!=="completo"&&isStale(t));
  return stale.map(t=>{
    const exp=DB.expedientes.find(e=>e.id===t.expId);
    const dias=Math.floor((Date.now()-parseTs(t.fechaMod||""))/86400000);
    return{id:"stale_"+t.id,tipo:"stale",auto:true,
      texto:`Sin movimiento hace ${dias} días: ${t.desc}${exp?" · "+exp.sac:""}`};
  });
}

function renderAll(){
  document.getElementById("config-banner-wrap").innerHTML=!APPS_SCRIPT_URL
    ?`<div class="config-banner"><i class="ti ti-settings"></i> Modo local — datos guardados solo en este navegador. Configurá APPS_SCRIPT_URL para compartir con el equipo.</div>`:""

  document.getElementById("turno-chip").textContent="Turno "+turnoActual();
  const urg=DB.tareas.filter(t=>t.urgente&&t.estado!=="completo").length;
  const pend=DB.tareas.filter(t=>t.estado==="pendiente"&&!t.urgente).length;
  const med=DB.tareas.filter(t=>t.estado==="medias").length;
  const gua=DB.guardia.filter(t=>t.estado!=="completo").length;
  const staleCount=DB.tareas.filter(t=>t.estado!=="completo"&&isStale(t)).length;
  const total=urg+pend+med+gua;
  document.getElementById("resumen").textContent=
    total===0?"Todo al día — sin pendientes":
    [urg&&`${urg} urgente${urg!==1?"s":""}`,pend&&`${pend} pendiente${pend!==1?"s":""}`,
     med&&`${med} a medias`,gua&&`${gua} guardia`,staleCount&&`${staleCount} sin movimiento`]
    .filter(Boolean).join(" · ");
  document.getElementById("nc-piz").textContent=total;
  document.getElementById("nc-exp").textContent=DB.expedientes.filter(e=>e.estado==="Activa").length;
  document.getElementById("cnt-urg").textContent=urg;
  document.getElementById("cnt-pend").textContent=pend;
  document.getElementById("cnt-med").textContent=med;
  document.getElementById("cnt-gua").textContent=gua;
  renderAvisos();
  renderCuad("cuad-urgentes",sorted(DB.tareas.filter(t=>t.urgente&&t.estado!=="completo")),"urg");
  renderCuad("cuad-pendientes",sorted(DB.tareas.filter(t=>t.estado==="pendiente"&&!t.urgente)),"pend");
  renderCuad("cuad-medias",sorted(DB.tareas.filter(t=>t.estado==="medias")),"med");
  renderGuardia();
  renderMov();
}

function renderAvisos(){
  const staleAvisos=getStaleAvisos();
  const todos=[...staleAvisos,...DB.avisos];
  const el=document.getElementById("avisos-lista");
  el.innerHTML=todos.length?todos.map(a=>`<div class="aviso-item">
    <span class="aviso-pin pin-${a.tipo==="stale"?"stale":a.tipo||"gris"}">${
      {rojo:"Alerta",azul:"Info",verde:"Recordar",gris:"Aviso",stale:"⏰ Inactivo"}[a.tipo]||"Aviso"
    }</span>
    <span class="aviso-txt">${a.texto}</span>
    ${!a.auto?`<button onclick="elimAviso('${a.id}')" style="border:none;background:transparent;cursor:pointer;color:var(--text3);font-size:12px;padding:0 3px;flex-shrink:0"><i class="ti ti-x"></i></button>`:``}
  </div>`).join(""):`<span style="color:var(--text3);font-size:12px;font-style:italic">Sin avisos activos.</span>`;
}
function elimAviso(id){DB.avisos=DB.avisos.filter(a=>a.id!==id);saveDB();renderAvisos();}

function tarjeta(t,tipo){
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  const ref=exp?exp.sac:"—";
  const caus=exp?(exp.causantes.length>26?exp.causantes.substring(0,26)+"…":exp.causantes):"";
  const stale=isStale(t);
  const clsExtra=stale?" t-stale":"";
  const dias=stale?Math.floor((Date.now()-parseTs(t.fechaMod||""))/86400000):0;
  return`<div class="tarjeta t-${tipo}${clsExtra}">
    <div class="tarjeta-desc">${t.desc}</div>
    <div class="tarjeta-ref"><i class="ti ti-folder" style="font-size:10px"></i> ${ref}${caus?" · "+caus:""}</div>
    ${stale?`<div class="tarjeta-stale"><i class="ti ti-clock-exclamation" style="font-size:10px"></i> Sin movimiento hace ${dias} días</div>`:""}
    ${t.obs?`<div class="tarjeta-obs"><i class="ti ti-alert-circle" style="font-size:10px"></i> Falta: ${t.obs}</div>`:""}
    <div class="tarjeta-actions">
      <button class="btn-urg-t ${t.urgente?"on":""}" onclick="toggleUrg('${t.id}')" title="${t.urgente?"Quitar urgente":"Urgente"}"><i class="ti ti-alert-triangle" style="font-size:10px"></i></button>
      ${tipo!=="med"?`<button class="btn-mini" onclick="irAMedias('${t.id}')"><i class="ti ti-clock-pause" style="font-size:10px"></i> A medias</button>`:""}
      <button class="btn-mini azul" onclick="irAExp('${t.expId}')"><i class="ti ti-arrow-right" style="font-size:10px"></i> Ver</button>
      <button class="btn-listo" onclick="completarT('${t.id}')"><i class="ti ti-check" style="font-size:10px"></i> Listo</button>
    </div>
    ${tipo==="med"&&!t.obs?`<input class="obs-mini" type="text" placeholder="¿Qué falta? (ej: firma del fiscal...)" onblur="guardarObs('${t.id}',this.value)">`:""}
  </div>`;
}

function renderCuad(elId,arr,tipo){
  document.getElementById(elId).innerHTML=arr.length
    ?arr.map(t=>tarjeta(t,tipo)).join("")
    :`<div class="empty-cuad"><i class="ti ti-circle-check" style="font-size:20px;color:var(--text3)"></i><span>Sin tareas en este estado</span></div>`;
}

function renderGuardia(){
  const arr=sorted(DB.guardia.filter(t=>t.estado!=="completo"));
  document.getElementById("gua-lista").innerHTML=arr.length?arr.map(t=>`
    <div class="tarjeta t-gua" style="margin-bottom:5px">
      <div class="tarjeta-desc">${t.desc}</div>
      <div class="tarjeta-ref">Guardia · <span class="badge-pri bp-${t.prioridad==="Alta"?"r":t.prioridad==="Media"?"a":"g"}">${t.prioridad||"Media"}</span></div>
      <div class="tarjeta-actions">
        <button class="btn-urg-t ${t.urgente?"on":""}" onclick="toggleUrgG('${t.id}')"><i class="ti ti-alert-triangle" style="font-size:10px"></i></button>
        <button class="btn-mini" style="color:var(--red);border-color:var(--red-border)" onclick="elimG('${t.id}')"><i class="ti ti-trash" style="font-size:10px"></i></button>
        <button class="btn-listo" onclick="completarG('${t.id}')"><i class="ti ti-check" style="font-size:10px"></i> Listo</button>
      </div>
    </div>`).join(""):"";
}

function renderMov(){
  const el=document.getElementById("mov-lista");
  el.innerHTML=DB.log.length
    ?DB.log.slice(0,20).map(l=>`<div class="mov-row"><span class="mov-time">${l.ts}</span><span class="mov-msg">${l.msg}</span></div>`).join("")
    :`<div style="font-size:11px;color:var(--text3);padding:10px 0;text-align:center;font-style:italic">Sin movimientos aún</div>`;
}

function renderExps(){
  const q=(document.getElementById("busq-g").value||"").toLowerCase();
  const qs=(document.getElementById("busq-sac").value||"").toLowerCase();
  const fe=document.getElementById("fil-est").value;
  const ft=document.getElementById("fil-tipo").value;
  let exps=DB.expedientes;
  if(q)exps=exps.filter(e=>e.sac.toLowerCase().includes(q)||e.causantes.toLowerCase().includes(q)||(e.brigada||"").toLowerCase().includes(q));
  if(qs)exps=exps.filter(e=>e.sac.toLowerCase().includes(qs));
  if(fe)exps=exps.filter(e=>e.estado===fe);
  if(ft)exps=exps.filter(e=>e.tipo===ft);
  const el=document.getElementById("exp-lista");
  if(!exps.length){el.innerHTML=`<div style="text-align:center;padding:28px;color:var(--text3);font-size:13px;font-style:italic">No se encontraron expedientes.</div>`;return;}
  el.innerHTML=exps.map(exp=>{
    const tareas=DB.tareas.filter(t=>t.expId===exp.id);
    const pend=tareas.filter(t=>t.estado!=="completo").length;
    const urg=tareas.filter(t=>t.urgente&&t.estado!=="completo").length;
    const med=tareas.filter(t=>t.estado==="medias").length;
    const stale=tareas.filter(t=>t.estado!=="completo"&&isStale(t)).length;
    const isOpen=expanded[exp.id];
    return`<div class="exp-card">
      <div class="exp-hdr" onclick="toggleExp('${exp.id}')">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
            <span class="exp-tit">${exp.sac}</span>
            ${urg?`<span class="badge b-r"><i class="ti ti-alert-triangle" style="font-size:9px"></i> ${urg}</span>`:""}
            ${med?`<span class="badge b-az"><i class="ti ti-clock-pause" style="font-size:9px"></i> ${med}</span>`:""}
            ${stale?`<span class="badge b-s"><i class="ti ti-clock-exclamation" style="font-size:9px"></i> ${stale}</span>`:""}
          </div>
          <div class="exp-meta">${exp.causantes} · ${exp.tipo}</div>
        </div>
        <span class="badge ${exp.estado==="Activa"?"b-v":exp.estado==="Cerrada"?"b-g":"b-a"}">${exp.estado}</span>
        <span style="font-size:11px;color:var(--text2);margin:0 7px">${pend} pend.</span>
        <i class="ti ${isOpen?"ti-chevron-up":"ti-chevron-down"}" style="font-size:13px;color:var(--text2)"></i>
      </div>
      ${isOpen?`<div class="exp-bdy">
        <div style="font-size:11px;color:var(--text3);margin-bottom:9px">Brigada: ${exp.brigada||"—"} · Cargado: ${exp.fecha}</div>
        ${tareas.map(t=>{
          const s=isStale(t)&&t.estado!=="completo";
          return`<div class="tarea-fila ${t.urgente&&t.estado!=="completo"?"u":t.estado==="medias"?"m":s?"s":""}">
            <input type="checkbox" class="tchk" ${t.estado==="completo"?"checked":""} onchange="toggleT('${t.id}',this.checked)">
            <div style="flex:1">
              <div class="ttxt ${t.estado==="completo"?"done":""}">${t.desc}</div>
              ${t.obs?`<div style="font-size:10px;color:var(--amber);font-style:italic">Falta: ${t.obs}</div>`:""}
              ${s?`<div style="font-size:10px;color:var(--stale);font-weight:600">Sin movimiento hace ${Math.floor((Date.now()-parseTs(t.fechaMod||""))/86400000)} días</div>`:""}
              ${t.estado==="completo"&&t.fechaComp?`<div style="font-size:10px;color:var(--text3)">✓ ${t.fechaComp}</div>`:""}
            </div>
            <div style="display:flex;gap:3px;flex-shrink:0">
              ${t.estado!=="completo"?`<button class="btn-urg-t ${t.urgente?"on":""}" onclick="toggleUrg('${t.id}')"><i class="ti ti-alert-triangle" style="font-size:10px"></i></button>`:""}
              ${t.estado==="pendiente"?`<button class="btn-mini" onclick="irAMedias('${t.id}')"><i class="ti ti-clock-pause" style="font-size:10px"></i></button>`:""}
            </div>
          </div>
          ${t.estado==="medias"&&!t.obs?`<input class="obs-mini" type="text" placeholder="¿Qué falta?" onblur="guardarObs('${t.id}',this.value)">`:""}`;
        }).join("")}
        <div class="add-row">
          <input type="text" id="nt-${exp.id}" placeholder="Agregar tarea al expediente...">
          <button class="btn-mini azul" onclick="agregarTareaExp('${exp.id}')"><i class="ti ti-plus"></i> Agregar</button>
        </div>
      </div>`:""}
    </div>`;
  }).join("");
}

function completarT(id){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.estado="completo";t.fechaComp=ts();t.fechaMod=ts();
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  addLog("✓ "+t.desc+" · "+(exp?.sac||""));
  saveDB();renderAll();
}
function completarG(id){
  const t=DB.guardia.find(t=>t.id===id);if(!t)return;
  t.estado="completo";t.fechaComp=ts();
  addLog("✓ Guardia: "+t.desc);
  saveDB();renderAll();
}
function toggleUrg(id){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.urgente=!t.urgente;t.fechaMod=ts();
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  addLog((t.urgente?"⚠ Urgente":"— Quitó urgente")+": "+t.desc+" · "+(exp?.sac||""));
  saveDB();renderAll();
}
function toggleUrgG(id){const t=DB.guardia.find(t=>t.id===id);if(!t)return;t.urgente=!t.urgente;saveDB();renderAll();}
function irAMedias(id){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.estado="medias";t.fechaMod=ts();
  saveDB();renderAll();
}
function guardarObs(id,val){
  const t=DB.tareas.find(t=>t.id===id);if(!t||!val.trim())return;
  t.obs=val.trim();t.fechaMod=ts();
  addLog("📝 "+t.desc+" → \""+val.trim()+"\"");
  saveDB();renderAll();
}
function elimG(id){DB.guardia=DB.guardia.filter(t=>t.id!==id);saveDB();renderAll();}
function agregarGuardia(){
  const txt=document.getElementById("gua-txt").value.trim();
  const pri=document.getElementById("gua-pri").value;
  if(!txt)return;
  DB.guardia.push({id:uid(),desc:txt,prioridad:pri,estado:"pendiente",urgente:pri==="Alta",obs:null,fechaComp:null});
  addLog("+ Guardia: "+txt);
  document.getElementById("gua-txt").value="";
  saveDB();renderAll();toast("Tarea de guardia agregada");
}
function irAExp(expId){setPage("expedientes");expanded[expId]=true;setTimeout(renderExps,50);}
function toggleExp(id){expanded[id]=!expanded[id];renderExps();}
function toggleT(id,checked){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.estado=checked?"completo":"pendiente";
  t.fechaComp=checked?ts():null;t.fechaMod=ts();
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  addLog((checked?"✓":"↩")+" "+t.desc+" · "+(exp?.sac||""));
  saveDB();renderAll();renderExps();
}
function agregarTareaExp(expId){
  const inp=document.getElementById("nt-"+expId);if(!inp||!inp.value.trim())return;
  const exp=DB.expedientes.find(e=>e.id===expId);
  DB.tareas.push({id:uid(),expId,desc:inp.value.trim(),estado:"pendiente",urgente:false,obs:null,fechaComp:null,fechaMod:ts()});
  addLog("+ Tarea: "+inp.value.trim()+" · "+(exp?.sac||""));
  inp.value="";saveDB();renderAll();renderExps();
}
function actualizarCat(){
  const tipo=document.getElementById("f-tipo").value;
  const cont=document.getElementById("cat-sel");
  if(!tipo){cont.innerHTML='<span style="color:var(--text2);font-size:12px">Elegí un tipo de trámite primero.</span>';return;}
  cont.innerHTML=(CAT[tipo]||[]).map(t=>`<label class="tsl"><input type="checkbox" class="tchk" value="${t}" checked> ${t}</label>`).join("");
}
function guardarExp(){
  const sac=document.getElementById("f-sac").value.trim();
  const tipo=document.getElementById("f-tipo").value;
  const caus=document.getElementById("f-caus").value.trim();
  const brig=document.getElementById("f-brig").value.trim();
  const est=document.getElementById("f-est2").value;
  const extra=document.getElementById("f-extra").value.trim();
  const urgente=document.getElementById("f-urgente").checked;
  if(!sac||!tipo||!caus){toast("Completá SAC, tipo y causantes");return;}
  const expId=uid();
  DB.expedientes.push({id:expId,sac,tipo,causantes:caus,brigada:brig,estado:est,fecha:ts()});
  document.querySelectorAll("#cat-sel input[type=checkbox]:checked").forEach(ch=>{
    DB.tareas.push({id:uid(),expId,desc:ch.value,estado:"pendiente",urgente,obs:null,fechaComp:null,fechaMod:ts()});
  });
  if(extra)DB.tareas.push({id:uid(),expId,desc:extra,estado:"pendiente",urgente,obs:null,fechaComp:null,fechaMod:ts()});
  addLog("+ Expediente: "+sac+" · "+caus.substring(0,25)+(urgente?" [URGENTE]":""));
  saveDB();renderAll();limpiarF();setPage("expedientes");
  expanded[expId]=true;setTimeout(renderExps,50);toast("Expediente guardado");
}
function limpiarF(){
  ["f-sac","f-caus","f-brig","f-extra"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f-tipo").value="";
  document.getElementById("f-est2").value="Activa";
  document.getElementById("f-urgente").checked=false;
  document.getElementById("cat-sel").innerHTML='<span style="color:var(--text2);font-size:12px">Elegí un tipo de trámite primero.</span>';
}
function abrirModalAviso(){
  document.getElementById("modal-wrap").innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)cerrarModal()">
    <div class="modal">
      <h3><i class="ti ti-speakerphone" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>Nuevo aviso</h3>
      <div class="fg"><label>Mensaje</label><textarea id="m-txt" placeholder="Escribí el aviso para el turno..."></textarea></div>
      <div class="fg"><label>Tipo</label>
        <select id="m-tipo"><option value="azul">Informativo</option><option value="rojo">Alerta</option><option value="verde">Recordatorio</option><option value="gris">General</option></select>
      </div>
      <div class="modal-btns">
        <button class="btn-mini" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-pri" onclick="guardarAviso()"><i class="ti ti-send" style="font-size:12px"></i> Publicar</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById("m-txt")?.focus(),50);
}
function cerrarModal(){document.getElementById("modal-wrap").innerHTML="";}
function guardarAviso(){
  const txt=document.getElementById("m-txt").value.trim();
  const tipo=document.getElementById("m-tipo").value;
  if(!txt)return;
  DB.avisos.unshift({id:uid(),tipo,texto:txt,ts:ts()});
  addLog("📌 Aviso: "+txt.substring(0,40));
  saveDB();renderAvisos();cerrarModal();toast("Aviso publicado");
}

loadLocal();
renderAll();
if(APPS_SCRIPT_URL){
  cargarDesdeRemoto().then(()=>renderAll());
  setInterval(()=>cargarDesdeRemoto().then(()=>renderAll()),30000);
}
</script>
</body>
