<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relevo Judicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg:#0f1117;--bg2:#161b24;--bg3:#1e2533;--bg4:#252d3d;
  --border:#2a3347;--border2:#3a4560;
  --text:#e8eaf0;--text2:#8892a4;--text3:#4a5568;
  --red:#ff4757;--red-bg:#2d1519;--red-border:#4d1f25;
  --amber:#ffaa00;--amber-bg:#2a1f00;--amber-border:#4a3800;
  --blue:#4a9eff;--blue-bg:#0d1e35;--blue-border:#1a3355;
  --green:#00c896;--green-bg:#001f18;--green-border:#003d2e;
  --purple:#a78bfa;--purple-bg:#1a1535;
  --radius:6px;--radius-lg:10px;
  --font:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;gap:12px;height:46px;position:sticky;top:0;z-index:50}
.logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.logo-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar-mid{flex:1;text-align:center;font-size:11px;color:var(--text2);font-family:var(--mono)}
.turno-chip{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:20px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.sync-status{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px;font-family:var(--mono);transition:color .3s}
.sync-status.ok{color:var(--green)}
.sync-status.err{color:var(--red)}
.sync-status.loading{color:var(--amber)}

/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:0}
.nav-tab{padding:9px 14px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--font);border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px;transition:all .15s;letter-spacing:.01em}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--blue)}
.nc{font-size:10px;padding:1px 5px;border-radius:20px;min-width:16px;text-align:center;font-weight:600;font-family:var(--mono)}
.nc-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.nc-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.nc-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* PAGES */
.page{display:none}.page.active{display:flex;flex-direction:column;gap:8px;padding:10px 12px}

/* AVISOS */
.avisos-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px 12px;display:flex;align-items:flex-start;gap:10px}
.avisos-icon{color:var(--text2);font-size:15px;flex-shrink:0;margin-top:2px}
.avisos-scroll{flex:1;display:flex;flex-direction:column;gap:4px;max-height:80px;overflow-y:auto}
.aviso-item{display:flex;align-items:baseline;gap:6px;font-size:12px;line-height:1.5}
.aviso-pin{font-size:10px;padding:1px 7px;border-radius:20px;white-space:nowrap;font-weight:500;font-family:var(--mono)}
.pin-rojo{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.pin-azul{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
.pin-verde{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.pin-gris{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.aviso-txt{color:var(--text)}
.btn-aviso{padding:4px 10px;font-size:11px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:var(--mono);white-space:nowrap;align-self:flex-start;transition:all .15s}
.btn-aviso:hover{background:var(--bg4);color:var(--text)}

/* CUADRANTES */
.cuadrantes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cuad{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden}
.cuad-hdr{padding:8px 12px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;font-family:var(--mono)}
.cuad-hdr.urg{background:var(--red-bg);color:var(--red);border-bottom:1px solid var(--red-border)}
.cuad-hdr.pend{background:var(--amber-bg);color:var(--amber);border-bottom:1px solid var(--amber-border)}
.cuad-hdr.med{background:var(--blue-bg);color:var(--blue);border-bottom:1px solid var(--blue-border)}
.cuad-hdr.gua{background:var(--green-bg);color:var(--green);border-bottom:1px solid var(--green-border)}
.cuad-body{padding:8px;overflow-y:auto;max-height:230px;display:flex;flex-direction:column;gap:5px}

/* TARJETAS */
.tarjeta{border-radius:var(--radius);padding:8px 10px;border:1px solid var(--border);background:var(--bg3);display:flex;flex-direction:column;gap:5px;transition:border-color .15s}
.tarjeta:hover{border-color:var(--border2)}
.tarjeta.t-urg{border-left:2px solid var(--red);background:var(--red-bg)}
.tarjeta.t-pend{border-left:2px solid var(--amber)}
.tarjeta.t-med{border-left:2px solid var(--blue);background:var(--blue-bg)}
.tarjeta.t-gua{border-left:2px solid var(--green)}
.tarjeta-desc{font-size:12px;font-weight:500;line-height:1.4;color:var(--text)}
.tarjeta-ref{font-size:10px;color:var(--text2);font-family:var(--mono)}
.tarjeta-obs{font-size:11px;color:var(--amber);font-style:italic;border-top:1px solid var(--border);padding-top:4px;margin-top:2px}
.tarjeta-actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.btn-listo{padding:3px 10px;font-size:11px;border-radius:var(--radius);border:1px solid var(--green-border);background:var(--green-bg);color:var(--green);cursor:pointer;font-family:var(--mono);font-weight:500;transition:all .15s}
.btn-listo:hover{background:var(--green);color:var(--bg)}
.btn-urg-t{padding:3px 7px;font-size:11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg4);color:var(--text2);cursor:pointer;font-family:var(--mono);transition:all .15s}
.btn-urg-t.on{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.btn-mini{padding:3px 8px;font-size:11px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg4);color:var(--text2);cursor:pointer;font-family:var(--mono);transition:all .15s}
.btn-mini:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.btn-mini.azul{color:var(--blue);border-color:var(--blue-border);background:var(--blue-bg)}
.btn-pri{padding:7px 16px;background:var(--blue);color:var(--bg);border:none;border-radius:var(--radius);font-family:var(--mono);font-size:12px;cursor:pointer;font-weight:600;transition:all .15s}
.btn-pri:hover{opacity:.85}
.obs-mini{width:100%;padding:4px 7px;border:1px solid var(--amber-border);border-radius:var(--radius);font-family:var(--font);font-size:11px;background:var(--bg);color:var(--text);margin-top:2px}
.obs-mini:focus{outline:none;border-color:var(--amber)}
.empty-cuad{font-size:11px;color:var(--text3);text-align:center;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--mono)}

/* GUARDIA INPUT */
.gua-add{display:flex;gap:5px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.gua-add input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--bg);color:var(--text)}
.gua-add input:focus{outline:none;border-color:var(--blue)}
.gua-add select{padding:5px 6px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:11px;background:var(--bg);color:var(--text);width:72px}
.badge-pri{font-size:10px;padding:1px 6px;border-radius:20px;font-family:var(--mono)}
.bp-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.bp-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.bp-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}

/* MOVIMIENTOS */
.movimientos{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.mov-hdr{padding:7px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);color:var(--text2);display:flex;align-items:center;gap:6px}
.mov-body{padding:4px 10px;overflow-y:auto;max-height:120px}
.mov-row{font-size:11px;padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:baseline;font-family:var(--mono)}
.mov-time{color:var(--text3);white-space:nowrap;min-width:72px}
.mov-msg{color:var(--text2)}

/* EXPEDIENTES */
.exp-search{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;background:var(--bg2)}
.exp-search input,.exp-search select{padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;background:var(--bg3);color:var(--text)}
.exp-search input{flex:1;min-width:140px}
.exp-search input:focus,.exp-search select:focus{outline:none;border-color:var(--blue)}
.panel-exp{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.exp-lista{padding:8px}
.exp-card{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden;transition:border-color .15s}
.exp-card:hover{border-color:var(--border2)}
.exp-hdr{padding:8px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--bg3);user-select:none}
.exp-hdr:hover{background:var(--bg4)}
.exp-tit{flex:1;font-size:12px;font-weight:500;font-family:var(--mono)}
.exp-meta{font-size:11px;color:var(--text2)}
.exp-bdy{padding:8px 10px;border-top:1px solid var(--border);background:var(--bg2)}
.tarea-fila{display:flex;align-items:flex-start;gap:6px;padding:5px 7px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:4px;background:var(--bg3)}
.tarea-fila.u{border-left:2px solid var(--red);background:var(--red-bg)}
.tarea-fila.m{border-left:2px solid var(--blue);background:var(--blue-bg)}
.tchk{width:14px;height:14px;cursor:pointer;accent-color:var(--green);flex-shrink:0;margin-top:2px}
.ttxt{font-size:12px;flex:1;line-height:1.4;color:var(--text)}
.ttxt.done{text-decoration:line-through;color:var(--text3)}
.add-row{display:flex;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.add-row input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--bg);color:var(--text)}
.add-row input:focus{outline:none;border-color:var(--blue)}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;font-family:var(--mono)}
.b-r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.b-a{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.b-v{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.b-g{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.b-az{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}

/* NUEVO FORM */
.panel-nuevo{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.fg input,.fg select{padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:12px;background:var(--bg3);color:var(--text);transition:border-color .15s}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--blue)}
.ff{grid-column:1/-1}
.tareas-sel{display:flex;flex-direction:column;gap:3px;max-height:140px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius);padding:7px;background:var(--bg3)}
.tsl{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:3px 0;color:var(--text)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:18px;width:340px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text)}
.modal input,.modal select,.modal textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-family:var(--font);font-size:13px;background:var(--bg3);color:var(--text);width:100%}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--blue)}
.modal textarea{resize:vertical;min-height:70px}
.modal-btns{display:flex;gap:6px;justify-content:flex-end}

/* TOAST */
.toast{position:fixed;bottom:16px;right:16px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:8px 14px;border-radius:var(--radius);font-size:12px;font-family:var(--mono);opacity:0;transition:opacity .3s;pointer-events:none;z-index:300}
.toast.show{opacity:1}

/* CONFIG BANNER */
.config-banner{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--amber);font-family:var(--mono);display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="logo-dot"></span>
    RELEVO · UJ
  </div>
  <div class="topbar-mid" id="resumen">cargando...</div>
  <div class="turno-chip" id="turno-chip"></div>
  <div class="sync-status" id="sync-status">
    <i class="ti ti-circle"></i> <span id="sync-txt">local</span>
  </div>
</div>

<div class="nav">
  <button class="nav-tab active" onclick="setPage('pizarron')" id="ntab-pizarron">
    <i class="ti ti-layout-dashboard"></i> Pizarrón
    <span class="nc nc-r" id="nc-piz">0</span>
  </button>
  <button class="nav-tab" onclick="setPage('expedientes')" id="ntab-expedientes">
    <i class="ti ti-folder"></i> Expedientes
    <span class="nc nc-g" id="nc-exp">0</span>
  </button>
  <button class="nav-tab" onclick="setPage('nuevo')" id="ntab-nuevo">
    <i class="ti ti-plus"></i> Nuevo expediente
  </button>
</div>

<div class="page active" id="page-pizarron">
  <div id="config-banner-wrap"></div>

  <div class="avisos-bar">
    <i class="ti ti-speakerphone avisos-icon"></i>
    <div class="avisos-scroll" id="avisos-lista"></div>
    <button class="btn-aviso" onclick="abrirModalAviso()"><i class="ti ti-plus"></i> Aviso</button>
  </div>

  <div class="cuadrantes">
    <div class="cuad">
      <div class="cuad-hdr urg"><i class="ti ti-alert-triangle"></i> Urgentes <span class="nc nc-r" id="cnt-urg">0</span></div>
      <div class="cuad-body" id="cuad-urgentes"></div>
    </div>
    <div class="cuad">
      <div class="cuad-hdr pend"><i class="ti ti-clock"></i> Pendientes <span class="nc nc-a" id="cnt-pend">0</span></div>
      <div class="cuad-body" id="cuad-pendientes"></div>
    </div>
    <div class="cuad">
      <div class="cuad-hdr med"><i class="ti ti-clock-pause"></i> A medias <span class="nc nc-a" id="cnt-med">0</span></div>
      <div class="cuad-body" id="cuad-medias"></div>
    </div>
    <div class="cuad">
      <div class="cuad-hdr gua"><i class="ti ti-shield"></i> Guardia <span class="nc nc-g" id="cnt-gua">0</span></div>
      <div class="cuad-body" id="cuad-guardia">
        <div id="gua-lista"></div>
        <div class="gua-add">
          <input type="text" id="gua-txt" placeholder="Nueva tarea de guardia...">
          <select id="gua-pri"><option>Alta</option><option selected>Media</option><option>Baja</option></select>
          <button class="btn-mini azul" onclick="agregarGuardia()"><i class="ti ti-plus"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div class="movimientos">
    <div class="mov-hdr"><i class="ti ti-history" style="font-size:13px"></i> Últimos movimientos</div>
    <div class="mov-body" id="mov-lista"></div>
  </div>
</div>

<div class="page" id="page-expedientes">
  <div class="panel-exp">
    <div class="exp-search">
      <input type="text" id="busq-g" placeholder="Buscar por SAC, causante, brigada..." oninput="renderExps()">
      <input type="text" id="busq-sac" placeholder="Nro SAC exacto..." oninput="renderExps()" style="max-width:170px">
      <select id="fil-est" onchange="renderExps()"><option value="">Todos</option><option>Activa</option><option>En espera</option><option>Cerrada</option></select>
      <select id="fil-tipo" onchange="renderExps()"><option value="">Todos los tipos</option><option>Colaboración</option><option>Investigación</option><option>Otro</option></select>
    </div>
    <div class="exp-lista" id="exp-lista"></div>
  </div>
</div>

<div class="page" id="page-nuevo">
  <div class="panel-nuevo">
    <div style="font-size:12px;font-weight:600;font-family:var(--mono);margin-bottom:12px;color:var(--text);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em"><i class="ti ti-plus"></i> Cargar nuevo expediente</div>
    <div class="form-grid">
      <div class="fg"><label>Número SAC *</label><input type="text" id="f-sac" placeholder="SAC-2024-0042"></div>
      <div class="fg"><label>Tipo de trámite *</label>
        <select id="f-tipo" onchange="actualizarCat()">
          <option value="">— Seleccionar —</option><option>Colaboración</option><option>Investigación</option><option>Otro</option>
        </select>
      </div>
      <div class="fg ff"><label>Causantes / Detenidos *</label><input type="text" id="f-caus" placeholder="García, Juan / López, María"></div>
      <div class="fg"><label>Brigada</label><input type="text" id="f-brig" placeholder="Brigada A"></div>
      <div class="fg"><label>Estado</label><select id="f-est2"><option>Activa</option><option>En espera</option><option>Cerrada</option></select></div>
      <div class="fg ff"><label>Tareas del catálogo</label>
        <div class="tareas-sel" id="cat-sel"><span style="color:var(--text2);font-size:11px">Elegí un tipo de trámite primero.</span></div>
      </div>
      <div class="fg ff"><label>Tarea adicional (libre)</label><input type="text" id="f-extra" placeholder="Tarea no prevista..."></div>
      <div class="ff" style="display:flex;justify-content:flex-end;gap:8px;margin-top:4px">
        <button class="btn-mini" onclick="limpiarF()">Limpiar</button>
        <button class="btn-pri" onclick="guardarExp()">Guardar expediente</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-wrap"></div>
<div class="toast" id="toast"></div>

<script>
// ─── CONFIGURACIÓN ──────────────────────────────────────────────────────────
// Pegá acá la URL de tu Google Apps Script Web App después de deployarla
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWjN8ny-WhEumRAdwzF_5xkrD04z3lnGlVMkIwO_matDDBfVI66DtweXyOclSUYqv3mQ/exec";
// ────────────────────────────────────────────────────────────────────────────

const CAT={
  "Colaboración":["Declarar Dupla","Colaboración","Constatación","Estado de Salud","Disposición conjunta","SENAF","Antecedentes","ITN – Titularidad","RUA – Balística","Domo - 911","Otro"],
  "Investigación":["Vigilancia Previa","SENAF","Estado de Salud","Constatación","RUA – Balística","ITN – Titularidad","Otro"],
  "Otro":["Otro"]
};
let DB={expedientes:[],tareas:[],guardia:[],avisos:[],log:[]};
let expanded={};
const LS_KEY="relevo_uj_v1";

function turnoActual(){const h=new Date().getHours();if(h>=7&&h<13)return"07–13";if(h>=13&&h<19)return"13–19";if(h>=19)return"19–01";return"01–07";}
function ts(){const d=new Date();return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function addLog(msg){DB.log.unshift({ts:ts(),msg});if(DB.log.length>80)DB.log.pop();}
function toast(msg){const e=document.getElementById("toast");e.textContent=msg;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2400);}

// ─── PERSISTENCIA ───────────────────────────────────────────────────────────
function saveLocal(){localStorage.setItem(LS_KEY,JSON.stringify(DB));}

function loadLocal(){
  try{const s=localStorage.getItem(LS_KEY);if(s)DB=JSON.parse(s);}catch(e){}
  if(!DB.avisos)DB.avisos=[];if(!DB.guardia)DB.guardia=[];if(!DB.log)DB.log=[];
  if(!DB.avisos.length)DB.avisos=[
    {id:uid(),tipo:"azul",texto:"Bienvenidos al turno "+turnoActual()+". Revisá urgentes antes de comenzar.",ts:ts()},
    {id:uid(),tipo:"rojo",texto:"Recordar declarar a las duplas apenas se reciban.",ts:ts()},
    {id:uid(),tipo:"verde",texto:"Iniciar expedientes apenas se consulten. No dejar pendiente.",ts:ts()},
  ];
}

function setSyncStatus(state,msg){
  const el=document.getElementById("sync-status");
  const txt=document.getElementById("sync-txt");
  el.className="sync-status "+state;
  txt.textContent=msg;
  const icons={ok:"ti-circle-check",err:"ti-circle-x",loading:"ti-refresh","":'ti-circle'};
  el.querySelector("i").className="ti "+(icons[state]||"ti-circle");
}

// Sync con Apps Script (cuando esté configurado)
async function syncRemote(action,payload={}){
  if(!APPS_SCRIPT_URL)return null;
  setSyncStatus("loading","sincronizando...");
  try{
    const r=await fetch(APPS_SCRIPT_URL,{
      method:"POST",
      body:JSON.stringify({action,...payload}),
      headers:{"Content-Type":"text/plain"}
    });
    const data=await r.json();
    setSyncStatus("ok","sincronizado "+ts());
    return data;
  }catch(e){
    setSyncStatus("err","sin conexión");
    return null;
  }
}

async function cargarDesdeRemoto(){
  if(!APPS_SCRIPT_URL){setSyncStatus("","local");return;}
  const data=await syncRemote("GET_ALL");
  if(data&&data.ok){
    DB=data.db;
    if(!DB.avisos)DB.avisos=[];if(!DB.guardia)DB.guardia=[];if(!DB.log)DB.log=[];
    saveLocal();
  }
}

async function saveDB(){
  saveLocal();
  if(APPS_SCRIPT_URL){
    await syncRemote("SAVE_ALL",{db:DB});
  } else {
    setSyncStatus("","local");
  }
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function setPage(p){
  ["pizarron","expedientes","nuevo"].forEach(id=>{
    document.getElementById("page-"+id).classList.toggle("active",id===p);
    document.getElementById("ntab-"+id).classList.toggle("active",id===p);
  });
  if(p==="expedientes")renderExps();
}

function prioOrd(p){return p==="Alta"?0:p==="Media"?1:2;}
function sorted(arr){
  return[...arr].sort((a,b)=>{
    if(a.urgente!==b.urgente)return a.urgente?-1:1;
    const pp=prioOrd(a.prioridad||"Media")-prioOrd(b.prioridad||"Media");
    if(pp!==0)return pp;
    return(a.id||"").localeCompare(b.id||"");
  });
}

function renderAll(){
  const bannerWrap=document.getElementById("config-banner-wrap");
  bannerWrap.innerHTML=!APPS_SCRIPT_URL?`<div class="config-banner"><i class="ti ti-settings"></i> Modo local — los datos se guardan solo en este navegador. Configurá APPS_SCRIPT_URL para sincronizar con el equipo.</div>`:"";

  document.getElementById("turno-chip").textContent="Turno "+turnoActual();
  const urg=DB.tareas.filter(t=>t.urgente&&t.estado!=="completo").length;
  const pend=DB.tareas.filter(t=>t.estado==="pendiente"&&!t.urgente).length;
  const med=DB.tareas.filter(t=>t.estado==="medias").length;
  const gua=DB.guardia.filter(t=>t.estado!=="completo").length;
  const total=urg+pend+med+gua;
  document.getElementById("resumen").textContent=total===0?"Todo al día ✓":`${urg} urgentes · ${pend} pendientes · ${med} a medias · ${gua} guardia`;
  document.getElementById("nc-piz").textContent=total;
  document.getElementById("nc-exp").textContent=DB.expedientes.filter(e=>e.estado==="Activa").length;
  document.getElementById("cnt-urg").textContent=urg;
  document.getElementById("cnt-pend").textContent=pend;
  document.getElementById("cnt-med").textContent=med;
  document.getElementById("cnt-gua").textContent=gua;
  renderAvisos();
  renderCuad("cuad-urgentes",sorted(DB.tareas.filter(t=>t.urgente&&t.estado!=="completo")),"urg");
  renderCuad("cuad-pendientes",sorted(DB.tareas.filter(t=>t.estado==="pendiente"&&!t.urgente)),"pend");
  renderCuad("cuad-medias",sorted(DB.tareas.filter(t=>t.estado==="medias")),"med");
  renderGuardia();
  renderMov();
}

function renderAvisos(){
  const el=document.getElementById("avisos-lista");
  el.innerHTML=DB.avisos.length?DB.avisos.map(a=>`<div class="aviso-item">
    <span class="aviso-pin pin-${a.tipo||"gris"}">${{rojo:"Alerta",azul:"Info",verde:"Recordar",gris:"Aviso"}[a.tipo]||"Aviso"}</span>
    <span class="aviso-txt">${a.texto}</span>
    <button onclick="elimAviso('${a.id}')" style="border:none;background:transparent;cursor:pointer;color:var(--text3);font-size:12px;padding:0 2px;flex-shrink:0"><i class="ti ti-x"></i></button>
  </div>`).join(""):`<span style="color:var(--text3);font-size:11px;font-family:var(--mono)">Sin avisos activos.</span>`;
}
function elimAviso(id){DB.avisos=DB.avisos.filter(a=>a.id!==id);saveDB();renderAvisos();}

function tarjeta(t,tipo){
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  const ref=exp?exp.sac:"—";
  const caus=exp?(exp.causantes.length>24?exp.causantes.substring(0,24)+"…":exp.causantes):"";
  return`<div class="tarjeta t-${tipo}">
    <div class="tarjeta-desc">${t.desc}</div>
    <div class="tarjeta-ref"><i class="ti ti-folder" style="font-size:10px"></i> ${ref}${caus?" · "+caus:""}</div>
    ${t.obs?`<div class="tarjeta-obs"><i class="ti ti-alert-circle" style="font-size:10px"></i> Falta: ${t.obs}</div>`:""}
    <div class="tarjeta-actions">
      <button class="btn-urg-t ${t.urgente?"on":""}" onclick="toggleUrg('${t.id}')" title="${t.urgente?"Quitar urgente":"Urgente"}"><i class="ti ti-alert-triangle" style="font-size:10px"></i></button>
      ${tipo!=="med"?`<button class="btn-mini" onclick="irAMedias('${t.id}')"><i class="ti ti-clock-pause" style="font-size:10px"></i> A medias</button>`:""}
      <button class="btn-mini azul" onclick="irAExp('${t.expId}')"><i class="ti ti-arrow-right" style="font-size:10px"></i> Ver</button>
      <button class="btn-listo" onclick="completarT('${t.id}')"><i class="ti ti-check" style="font-size:10px"></i> Listo</button>
    </div>
    ${tipo==="med"&&!t.obs?`<input class="obs-mini" type="text" placeholder="¿Qué falta? (ej: firma del fiscal...)" onblur="guardarObs('${t.id}',this.value)">`:""}
  </div>`;
}

function renderCuad(elId,arr,tipo){
  document.getElementById(elId).innerHTML=arr.length
    ?arr.map(t=>tarjeta(t,tipo)).join("")
    :`<div class="empty-cuad"><i class="ti ti-circle-check" style="font-size:18px"></i><span>sin tareas</span></div>`;
}

function renderGuardia(){
  const arr=sorted(DB.guardia.filter(t=>t.estado!=="completo"));
  document.getElementById("gua-lista").innerHTML=arr.length?arr.map(t=>`
    <div class="tarjeta t-gua" style="margin-bottom:4px">
      <div class="tarjeta-desc">${t.desc}</div>
      <div class="tarjeta-ref">Guardia · <span class="badge-pri bp-${t.prioridad==="Alta"?"r":t.prioridad==="Media"?"a":"g"}">${t.prioridad||"Media"}</span></div>
      <div class="tarjeta-actions">
        <button class="btn-urg-t ${t.urgente?"on":""}" onclick="toggleUrgG('${t.id}')"><i class="ti ti-alert-triangle" style="font-size:10px"></i></button>
        <button class="btn-mini" style="color:var(--red);border-color:var(--red-border)" onclick="elimG('${t.id}')"><i class="ti ti-trash" style="font-size:10px"></i></button>
        <button class="btn-listo" onclick="completarG('${t.id}')"><i class="ti ti-check" style="font-size:10px"></i> Listo</button>
      </div>
    </div>`).join(""):"";
}

function renderMov(){
  const el=document.getElementById("mov-lista");
  el.innerHTML=DB.log.length
    ?DB.log.slice(0,20).map(l=>`<div class="mov-row"><span class="mov-time">${l.ts}</span><span class="mov-msg">${l.msg}</span></div>`).join("")
    :`<div style="font-size:11px;color:var(--text3);padding:8px 0;text-align:center;font-family:var(--mono)">sin movimientos aún</div>`;
}

function renderExps(){
  const q=(document.getElementById("busq-g").value||"").toLowerCase();
  const qs=(document.getElementById("busq-sac").value||"").toLowerCase();
  const fe=document.getElementById("fil-est").value;
  const ft=document.getElementById("fil-tipo").value;
  let exps=DB.expedientes;
  if(q)exps=exps.filter(e=>e.sac.toLowerCase().includes(q)||e.causantes.toLowerCase().includes(q)||(e.brigada||"").toLowerCase().includes(q));
  if(qs)exps=exps.filter(e=>e.sac.toLowerCase().includes(qs));
  if(fe)exps=exps.filter(e=>e.estado===fe);
  if(ft)exps=exps.filter(e=>e.tipo===ft);
  const el=document.getElementById("exp-lista");
  if(!exps.length){el.innerHTML=`<div style="text-align:center;padding:24px;color:var(--text3);font-size:12px;font-family:var(--mono)">sin resultados</div>`;return;}
  el.innerHTML=exps.map(exp=>{
    const tareas=DB.tareas.filter(t=>t.expId===exp.id);
    const pend=tareas.filter(t=>t.estado!=="completo").length;
    const urg=tareas.filter(t=>t.urgente&&t.estado!=="completo").length;
    const med=tareas.filter(t=>t.estado==="medias").length;
    const isOpen=expanded[exp.id];
    return`<div class="exp-card">
      <div class="exp-hdr" onclick="toggleExp('${exp.id}')">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
            <span class="exp-tit">${exp.sac}</span>
            ${urg?`<span class="badge b-r"><i class="ti ti-alert-triangle" style="font-size:9px"></i> ${urg}</span>`:""}
            ${med?`<span class="badge b-az"><i class="ti ti-clock-pause" style="font-size:9px"></i> ${med}</span>`:""}
          </div>
          <div class="exp-meta">${exp.causantes} · ${exp.tipo}</div>
        </div>
        <span class="badge ${exp.estado==="Activa"?"b-v":exp.estado==="Cerrada"?"b-g":"b-a"}">${exp.estado}</span>
        <span style="font-size:11px;color:var(--text2);margin:0 6px;font-family:var(--mono)">${pend} pend.</span>
        <i class="ti ${isOpen?"ti-chevron-up":"ti-chevron-down"}" style="font-size:13px;color:var(--text2)"></i>
      </div>
      ${isOpen?`<div class="exp-bdy">
        <div style="font-size:10px;color:var(--text3);margin-bottom:8px;font-family:var(--mono)">Brigada: ${exp.brigada||"—"} · Cargado: ${exp.fecha}</div>
        ${tareas.map(t=>`<div class="tarea-fila ${t.urgente&&t.estado!=="completo"?"u":t.estado==="medias"?"m":""}">
          <input type="checkbox" class="tchk" ${t.estado==="completo"?"checked":""} onchange="toggleT('${t.id}',this.checked)">
          <div style="flex:1">
            <div class="ttxt ${t.estado==="completo"?"done":""}">${t.desc}</div>
            ${t.obs?`<div style="font-size:10px;color:var(--amber);font-style:italic">Falta: ${t.obs}</div>`:""}
            ${t.estado==="completo"&&t.fechaComp?`<div style="font-size:10px;color:var(--text3);font-family:var(--mono)">✓ ${t.fechaComp}</div>`:""}
          </div>
          <div style="display:flex;gap:3px;flex-shrink:0">
            ${t.estado!=="completo"?`<button class="btn-urg-t ${t.urgente?"on":""}" onclick="toggleUrg('${t.id}')"><i class="ti ti-alert-triangle" style="font-size:10px"></i></button>`:""}
            ${t.estado==="pendiente"?`<button class="btn-mini" onclick="irAMedias('${t.id}')"><i class="ti ti-clock-pause" style="font-size:10px"></i></button>`:""}
          </div>
        </div>
        ${t.estado==="medias"&&!t.obs?`<input class="obs-mini" type="text" placeholder="¿Qué falta?" onblur="guardarObs('${t.id}',this.value)">`:""}
        `).join("")}
        <div class="add-row">
          <input type="text" id="nt-${exp.id}" placeholder="Agregar tarea al expediente...">
          <button class="btn-mini azul" onclick="agregarTareaExp('${exp.id}')"><i class="ti ti-plus"></i> Agregar</button>
        </div>
      </div>`:""}
    </div>`;
  }).join("");
}

// ─── ACCIONES ───────────────────────────────────────────────────────────────
function completarT(id){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.estado="completo";t.fechaComp=ts();
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  addLog("✓ "+t.desc+" · "+(exp?.sac||""));
  saveDB();renderAll();
}
function completarG(id){
  const t=DB.guardia.find(t=>t.id===id);if(!t)return;
  t.estado="completo";t.fechaComp=ts();
  addLog("✓ Guardia: "+t.desc);
  saveDB();renderAll();
}
function toggleUrg(id){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.urgente=!t.urgente;
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  addLog((t.urgente?"⚠ Urgente":"— Quitó urgente")+": "+t.desc+" · "+(exp?.sac||""));
  saveDB();renderAll();
}
function toggleUrgG(id){const t=DB.guardia.find(t=>t.id===id);if(!t)return;t.urgente=!t.urgente;saveDB();renderAll();}
function irAMedias(id){const t=DB.tareas.find(t=>t.id===id);if(!t)return;t.estado="medias";saveDB();renderAll();}
function guardarObs(id,val){const t=DB.tareas.find(t=>t.id===id);if(!t||!val.trim())return;t.obs=val.trim();addLog("📝 "+t.desc+" → \""+val.trim()+"\"");saveDB();renderAll();}
function elimG(id){DB.guardia=DB.guardia.filter(t=>t.id!==id);saveDB();renderAll();}
function agregarGuardia(){
  const txt=document.getElementById("gua-txt").value.trim();
  const pri=document.getElementById("gua-pri").value;
  if(!txt)return;
  DB.guardia.push({id:uid(),desc:txt,prioridad:pri,estado:"pendiente",urgente:pri==="Alta",obs:null,fechaComp:null});
  addLog("+ Guardia: "+txt);
  document.getElementById("gua-txt").value="";
  saveDB();renderAll();toast("Tarea de guardia agregada");
}
function irAExp(expId){setPage("expedientes");expanded[expId]=true;setTimeout(renderExps,50);}
function toggleExp(id){expanded[id]=!expanded[id];renderExps();}
function toggleT(id,checked){
  const t=DB.tareas.find(t=>t.id===id);if(!t)return;
  t.estado=checked?"completo":"pendiente";t.fechaComp=checked?ts():null;
  const exp=DB.expedientes.find(e=>e.id===t.expId);
  addLog((checked?"✓":"↩")+" "+t.desc+" · "+(exp?.sac||""));
  saveDB();renderAll();renderExps();
}
function agregarTareaExp(expId){
  const inp=document.getElementById("nt-"+expId);if(!inp||!inp.value.trim())return;
  const exp=DB.expedientes.find(e=>e.id===expId);
  DB.tareas.push({id:uid(),expId,desc:inp.value.trim(),estado:"pendiente",urgente:false,obs:null,fechaComp:null});
  addLog("+ Tarea: "+inp.value.trim()+" · "+(exp?.sac||""));
  inp.value="";saveDB();renderAll();renderExps();
}
function actualizarCat(){
  const tipo=document.getElementById("f-tipo").value;
  const cont=document.getElementById("cat-sel");
  if(!tipo){cont.innerHTML='<span style="color:var(--text2);font-size:11px">Elegí un tipo de trámite primero.</span>';return;}
  cont.innerHTML=(CAT[tipo]||[]).map(t=>`<label class="tsl"><input type="checkbox" class="tchk" value="${t}" checked> ${t}</label>`).join("");
}
function guardarExp(){
  const sac=document.getElementById("f-sac").value.trim();
  const tipo=document.getElementById("f-tipo").value;
  const caus=document.getElementById("f-caus").value.trim();
  const brig=document.getElementById("f-brig").value.trim();
  const est=document.getElementById("f-est2").value;
  const extra=document.getElementById("f-extra").value.trim();
  if(!sac||!tipo||!caus){toast("Completá SAC, tipo y causantes");return;}
  const expId=uid();
  DB.expedientes.push({id:expId,sac,tipo,causantes:caus,brigada:brig,estado:est,fecha:ts()});
  document.querySelectorAll("#cat-sel input[type=checkbox]:checked").forEach(ch=>{
    DB.tareas.push({id:uid(),expId,desc:ch.value,estado:"pendiente",urgente:false,obs:null,fechaComp:null});
  });
  if(extra)DB.tareas.push({id:uid(),expId,desc:extra,estado:"pendiente",urgente:false,obs:null,fechaComp:null});
  addLog("+ Expediente: "+sac+" · "+caus.substring(0,25));
  saveDB();renderAll();limpiarF();setPage("expedientes");
  expanded[expId]=true;setTimeout(renderExps,50);toast("Expediente guardado");
}
function limpiarF(){
  ["f-sac","f-caus","f-brig","f-extra"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f-tipo").value="";
  document.getElementById("f-est2").value="Activa";
  document.getElementById("cat-sel").innerHTML='<span style="color:var(--text2);font-size:11px">Elegí un tipo de trámite primero.</span>';
}
function abrirModalAviso(){
  document.getElementById("modal-wrap").innerHTML=`<div class="modal-overlay" id="mo">
    <div class="modal">
      <h3><i class="ti ti-speakerphone"></i> Nuevo aviso</h3>
      <textarea id="m-txt" placeholder="Escribí el aviso para el turno..."></textarea>
      <div class="fg"><label>Tipo</label>
        <select id="m-tipo"><option value="azul">Info</option><option value="rojo">Alerta</option><option value="verde">Recordar</option><option value="gris">General</option></select>
      </div>
      <div class="modal-btns">
        <button class="btn-mini" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-pri" onclick="guardarAviso()">Publicar</button>
      </div>
    </div>
  </div>`;
}
function cerrarModal(){document.getElementById("modal-wrap").innerHTML="";}
function guardarAviso(){
  const txt=document.getElementById("m-txt").value.trim();
  const tipo=document.getElementById("m-tipo").value;
  if(!txt)return;
  DB.avisos.unshift({id:uid(),tipo,texto:txt,ts:ts()});
  addLog("📌 Aviso: "+txt.substring(0,40));
  saveDB();renderAvisos();cerrarModal();toast("Aviso publicado");
}

// ─── INIT ───────────────────────────────────────────────────────────────────
loadLocal();
renderAll();
if(APPS_SCRIPT_URL){
  cargarDesdeRemoto().then(()=>renderAll());
  setInterval(()=>cargarDesdeRemoto().then(()=>renderAll()),30000);
}
</script>
